services:
  - type: web
    name: notion-daily-defect-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_TIMEZONE
        value: Asia/Seoul
      - key: SCHEDULER_ENABLED
        value: true
      - key: SCHEDULER_HOUR
        value: 8
      - key: SCHEDULER_MINUTE
        value: 30
      - key: DATABASE_URL
        value: sqlite:////tmp/defects.db
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: NOTION_VERSION
        value: 2022-06-28
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: RENDER_PUBLIC_ORIGIN
        value: https://notion-daily-defect-dashboard.onrender.com
      - key: GITHUB_PAGES_OWNER
        value: mhjang-qa
      - key: GITHUB_PAGES_REPO
        value: Automated-Report-Generation-
      - key: GITHUB_PAGES_BRANCH
        value: main
      - key: GITHUB_PAGES_PATH
        value: docs/defect-dashboard/hanpass-renewal.html
      - key: GITHUB_PAGES_URL
        value: https://mhjang-qa.github.io/Automated-Report-Generation-/defect-dashboard/hanpass-renewal.html
      - key: GITHUB_PAGES_TOKEN
        sync: false
