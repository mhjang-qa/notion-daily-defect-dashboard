<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanpass 앱개편 결함 현황</title>
    <style>
      :root {
        color: #1f2328;
        background: #f6f8fa;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f8fa;
      }

      .shell {
        width: min(100%, 1680px);
        margin: 0 auto;
        padding: 16px 24px 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #d0d7de;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 4px;
        color: #57606a;
        font-size: 12px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button,
      select {
        height: 34px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #fff;
        color: #24292f;
        font: inherit;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
        font-weight: 750;
      }

      button.primary {
        border-color: #1f6feb;
        background: #1f6feb;
        color: #fff;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .notice {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #bf8700;
        border-radius: 6px;
        background: #fff8c5;
      }

      .notice.show {
        display: block;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 8px;
        margin: 14px 0;
      }

      .card,
      .panel {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #fff;
      }

      .card {
        padding: 12px;
      }

      .card span {
        display: block;
        color: #57606a;
        font-size: 12px;
        font-weight: 750;
      }

      .card strong {
        display: block;
        margin-top: 6px;
        font-size: 28px;
        line-height: 1;
      }

      .versions {
        display: grid;
        grid-template-columns: repeat(2, minmax(520px, 1fr));
        gap: 12px;
      }

      .panel {
        min-width: 0;
        padding: 14px;
      }

      .panel h2 {
        font-size: 15px;
      }

      .panel-meta {
        margin-top: 4px;
        color: #57606a;
        font-size: 12px;
      }

      .mini-kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 12px 0;
      }

      .mini-kpis div {
        padding: 10px;
        border: 1px solid #d8dee4;
        border-radius: 6px;
        background: #f6f8fa;
      }

      .mini-kpis span {
        color: #57606a;
        font-size: 11px;
        font-weight: 750;
      }

      .mini-kpis strong {
        display: block;
        margin-top: 4px;
        font-size: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 8px 6px;
        border-bottom: 1px solid #d8dee4;
        text-align: right;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      th {
        color: #57606a;
        font-size: 11px;
        font-weight: 750;
      }

      .empty {
        padding: 22px 0 10px;
        color: #57606a;
        text-align: center;
      }

      .charts {
        display: grid;
        grid-template-columns: 1.35fr 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }

      .chart-panel {
        min-width: 0;
        padding: 14px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #fff;
      }

      .chart-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .chart-head h2 {
        font-size: 15px;
      }

      .chart-head span,
      .legend {
        color: #57606a;
        font-size: 12px;
      }

      .chart-box {
        width: 100%;
        height: 260px;
      }

      .chart-box svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .axis,
      .grid {
        stroke: #d8dee4;
        stroke-width: 1;
      }

      .axis-label {
        fill: #57606a;
        font-size: 11px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 4px;
        border-radius: 50%;
        vertical-align: -1px;
      }

      @media (max-width: 820px) {
        .topbar,
        .versions,
        .charts {
          grid-template-columns: 1fr;
        }

        .topbar {
          display: grid;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }

        .versions {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Hanpass 앱개편 결함 현황</h1>
          <p class="subtitle">[Hanpass][앱개편], [Hanpass][앱개편][BO] 전용 Notion Embed</p>
        </div>
        <div class="actions">
          <select id="rangeSelect" aria-label="기간">
            <option value="7d">최근 7일</option>
            <option value="14d">최근 14일</option>
            <option value="30d" selected>최근 30일</option>
            <option value="all">전체</option>
          </select>
          <button id="refreshButton" type="button">새로고침</button>
          <button id="syncButton" class="primary" type="button">동기화</button>
        </div>
      </header>

      <div id="notice" class="notice"></div>
      <section id="summary" class="summary"></section>
      <section id="versions" class="versions"></section>
      <section id="charts" class="charts"></section>
    </main>

    <script>
      const TARGET_VERSIONS = ["[Hanpass][앱개편]", "[Hanpass][앱개편][BO]"];
      const summary = document.querySelector("#summary");
      const versions = document.querySelector("#versions");
      const notice = document.querySelector("#notice");
      const charts = document.querySelector("#charts");
      const rangeSelect = document.querySelector("#rangeSelect");
      const refreshButton = document.querySelector("#refreshButton");
      const syncButton = document.querySelector("#syncButton");

      refreshButton.addEventListener("click", () => loadAll());
      syncButton.addEventListener("click", () => syncNow());
      rangeSelect.addEventListener("change", () => loadAll());

      function showNotice(message) {
        notice.textContent = message;
        notice.classList.toggle("show", Boolean(message));
      }

      async function request(path, init) {
        const response = await fetch(path, init);
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || `HTTP ${response.status}`);
        }
        return response.json();
      }

      async function syncNow() {
        syncButton.disabled = true;
        refreshButton.disabled = true;
        showNotice("Notion 데이터를 동기화 중입니다.");
        try {
          await request("/api/collect", { method: "POST" });
          await loadAll("동기화 완료");
        } catch (error) {
          showNotice(error.message || "동기화에 실패했습니다.");
        } finally {
          syncButton.disabled = false;
          refreshButton.disabled = false;
        }
      }

      async function loadAll(doneMessage = "") {
        refreshButton.disabled = true;
        try {
          const rows = await Promise.all(
            TARGET_VERSIONS.map(async (version) => {
              const params = new URLSearchParams({ target_version: version, range: rangeSelect.value });
              const data = await request(`/api/dashboard?${params}`);
              return { version, rows: data.rows || [], updatedAt: data.updated_at };
            }),
          );
          render(rows);
          showNotice(doneMessage);
        } catch (error) {
          showNotice(error.message || "데이터를 불러오지 못했습니다.");
        } finally {
          refreshButton.disabled = false;
        }
      }

      function render(groups) {
        const latestRows = groups.map((group) => group.rows[group.rows.length - 1]).filter(Boolean);
        const total = latestRows.reduce((sum, row) => sum + row.total_count, 0);
        const fresh = latestRows.reduce((sum, row) => sum + row.new_count, 0);
        const unresolved = latestRows.reduce((sum, row) => sum + row.unresolved_count, 0);
        const progress = latestRows.reduce((sum, row) => sum + row.in_progress_count, 0);
        const resolved = latestRows.reduce((sum, row) => sum + row.resolved_count, 0);

        summary.innerHTML = [
          ["전체", total],
          ["금일 신규", `+${fresh}`],
          ["미처리", unresolved],
          ["처리중", progress],
          ["완료", resolved],
        ]
          .map(([label, value]) => `<article class="card"><span>${label}</span><strong>${value}</strong></article>`)
          .join("");

        versions.innerHTML = groups.map(renderGroup).join("");
        charts.innerHTML = renderCharts(aggregateRows(groups));
      }

      function renderGroup(group) {
        const latest = group.rows[group.rows.length - 1];
        if (!latest) {
          return `
            <article class="panel">
              <h2>${escapeHtml(group.version)}</h2>
              <p class="empty">Snapshot 데이터가 없습니다. 동기화 버튼을 눌러 수집하세요.</p>
            </article>
          `;
        }

        const body = group.rows
          .slice(-10)
          .reverse()
          .map(
            (row) => `
              <tr>
                <td>${formatDate(row.snapshot_date)}</td>
                <td>${row.total_count}</td>
                <td>+${row.new_count}</td>
                <td>${row.unresolved_count}</td>
                <td>${row.in_progress_count}</td>
                <td>${row.resolved_count}</td>
                <td>${Number(row.resolution_rate).toFixed(1)}%</td>
              </tr>
            `,
          )
          .join("");

        return `
          <article class="panel">
            <h2>${escapeHtml(group.version)}</h2>
            <p class="panel-meta">Updated ${formatDateTime(latest.collected_at)}</p>
            <div class="mini-kpis">
              <div><span>전체</span><strong>${latest.total_count}</strong></div>
              <div><span>신규</span><strong>+${latest.new_count}</strong></div>
              <div><span>미처리</span><strong>${latest.unresolved_count}</strong></div>
              <div><span>완료</span><strong>${latest.resolved_count}</strong></div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>날짜</th>
                  <th>전체</th>
                  <th>신규</th>
                  <th>미처리</th>
                  <th>처리중</th>
                  <th>완료</th>
                  <th>처리율</th>
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </article>
        `;
      }

      function formatDate(value) {
        const date = new Date(`${value}T00:00:00`);
        return `${date.getMonth() + 1}/${date.getDate()}`;
      }

      function formatDateTime(value) {
        if (!value) return "-";
        return new Intl.DateTimeFormat("ko-KR", { dateStyle: "short", timeStyle: "short" }).format(new Date(value));
      }

      function aggregateRows(groups) {
        const byDate = new Map();
        groups.forEach((group) => {
          group.rows.forEach((row) => {
            const current = byDate.get(row.snapshot_date) || {
              snapshot_date: row.snapshot_date,
              total_count: 0,
              new_count: 0,
              unresolved_count: 0,
              in_progress_count: 0,
              resolved_count: 0,
              completed_today_count: 0,
            };
            current.total_count += row.total_count;
            current.new_count += row.new_count;
            current.unresolved_count += row.unresolved_count;
            current.in_progress_count += row.in_progress_count;
            current.resolved_count += row.resolved_count;
            current.completed_today_count += row.completed_today_count;
            byDate.set(row.snapshot_date, current);
          });
        });
        return Array.from(byDate.values()).sort((a, b) => a.snapshot_date.localeCompare(b.snapshot_date));
      }

      function renderCharts(rows) {
        if (!rows.length) {
          return `
            <article class="chart-panel">
              <div class="chart-head"><h2>Daily Defect Trend</h2><span>전체 / 미처리 / 처리중 / 완료</span></div>
              <p class="empty">그래프를 표시할 Snapshot 데이터가 없습니다.</p>
            </article>
          `;
        }
        return `
          <article class="chart-panel">
            <div class="chart-head"><h2>Daily Defect Trend</h2><span>전체 / 미처리 / 처리중 / 완료</span></div>
            <div class="chart-box">${lineChart(rows, [
              ["total_count", "#1f6feb", "전체"],
              ["unresolved_count", "#d1242f", "미처리"],
              ["in_progress_count", "#bf8700", "처리중"],
              ["resolved_count", "#1a7f37", "완료"],
            ])}</div>
            ${legend([["#1f6feb", "전체"], ["#d1242f", "미처리"], ["#bf8700", "처리중"], ["#1a7f37", "완료"]])}
          </article>
          <article class="chart-panel">
            <div class="chart-head"><h2>New Defects</h2><span>일자별 신규 발생량</span></div>
            <div class="chart-box">${barChart(rows, "new_count", "#1f6feb", "신규")}</div>
          </article>
          <article class="chart-panel">
            <div class="chart-head"><h2>Resolution Progress</h2><span>신규 / 완료 / 미처리 잔량</span></div>
            <div class="chart-box">${comboChart(rows)}</div>
            ${legend([["#1f6feb", "신규"], ["#1a7f37", "완료"], ["#d1242f", "미처리"]])}
          </article>
        `;
      }

      function chartScales(rows, keys) {
        const width = 760;
        const height = 250;
        const pad = { left: 44, right: 16, top: 16, bottom: 34 };
        const values = rows.flatMap((row) => keys.map((key) => Number(row[key]) || 0));
        const maxValue = Math.max(1, ...values);
        const roundedMax = Math.max(4, Math.ceil(maxValue / 4) * 4);
        const plotWidth = width - pad.left - pad.right;
        const plotHeight = height - pad.top - pad.bottom;
        const x = (index) => pad.left + (rows.length <= 1 ? plotWidth / 2 : (plotWidth / (rows.length - 1)) * index);
        const y = (value) => pad.top + plotHeight - (Number(value) / roundedMax) * plotHeight;
        return { width, height, pad, plotWidth, plotHeight, roundedMax, x, y };
      }

      function grid(rows, scale) {
        const ticks = [0, 0.25, 0.5, 0.75, 1];
        const yLines = ticks
          .map((tick) => {
            const value = Math.round(scale.roundedMax * tick);
            const y = scale.y(value);
            return `<line class="grid" x1="${scale.pad.left}" y1="${y}" x2="${scale.width - scale.pad.right}" y2="${y}"></line><text class="axis-label" x="8" y="${y + 4}">${value}</text>`;
          })
          .join("");
        const xLabels = rows
          .map((row, index) => `<text class="axis-label" x="${scale.x(index)}" y="${scale.height - 10}" text-anchor="middle">${formatDate(row.snapshot_date)}</text>`)
          .join("");
        return `${yLines}<line class="axis" x1="${scale.pad.left}" y1="${scale.pad.top}" x2="${scale.pad.left}" y2="${scale.height - scale.pad.bottom}"></line><line class="axis" x1="${scale.pad.left}" y1="${scale.height - scale.pad.bottom}" x2="${scale.width - scale.pad.right}" y2="${scale.height - scale.pad.bottom}"></line>${xLabels}`;
      }

      function lineChart(rows, series) {
        const scale = chartScales(rows, series.map(([key]) => key));
        const lines = series
          .map(([key, color, label]) => {
            const points = rows.map((row, index) => `${scale.x(index)},${scale.y(row[key])}`).join(" ");
            const dots = rows
              .map((row, index) => `<circle cx="${scale.x(index)}" cy="${scale.y(row[key])}" r="3.5" fill="${color}"><title>${formatDate(row.snapshot_date)} ${label}: ${row[key]}</title></circle>`)
              .join("");
            return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>${dots}`;
          })
          .join("");
        return `<svg viewBox="0 0 ${scale.width} ${scale.height}" role="img" aria-label="Daily Defect Trend">${grid(rows, scale)}${lines}</svg>`;
      }

      function barChart(rows, key, color, label) {
        const scale = chartScales(rows, [key]);
        const gap = 10;
        const step = scale.plotWidth / Math.max(1, rows.length);
        const barWidth = Math.max(14, Math.min(42, step - gap));
        const bars = rows
          .map((row, index) => {
            const x = scale.pad.left + step * index + (step - barWidth) / 2;
            const y = scale.y(row[key]);
            const height = scale.height - scale.pad.bottom - y;
            return `<rect x="${x}" y="${y}" width="${barWidth}" height="${height}" rx="4" fill="${color}"><title>${formatDate(row.snapshot_date)} ${label}: ${row[key]}</title></rect>`;
          })
          .join("");
        return `<svg viewBox="0 0 ${scale.width} ${scale.height}" role="img" aria-label="${label}">${grid(rows, scale)}${bars}</svg>`;
      }

      function comboChart(rows) {
        const scale = chartScales(rows, ["new_count", "completed_today_count", "unresolved_count"]);
        const step = scale.plotWidth / Math.max(1, rows.length);
        const barWidth = Math.max(8, Math.min(24, step / 4));
        const bars = rows
          .map((row, index) => {
            const center = scale.pad.left + step * index + step / 2;
            const newY = scale.y(row.new_count);
            const doneY = scale.y(row.completed_today_count);
            const base = scale.height - scale.pad.bottom;
            return `
              <rect x="${center - barWidth - 2}" y="${newY}" width="${barWidth}" height="${base - newY}" rx="3" fill="#1f6feb"><title>${formatDate(row.snapshot_date)} 신규: ${row.new_count}</title></rect>
              <rect x="${center + 2}" y="${doneY}" width="${barWidth}" height="${base - doneY}" rx="3" fill="#1a7f37"><title>${formatDate(row.snapshot_date)} 완료: ${row.completed_today_count}</title></rect>
            `;
          })
          .join("");
        const points = rows.map((row, index) => `${scale.x(index)},${scale.y(row.unresolved_count)}`).join(" ");
        const dots = rows
          .map((row, index) => `<circle cx="${scale.x(index)}" cy="${scale.y(row.unresolved_count)}" r="3.5" fill="#d1242f"><title>${formatDate(row.snapshot_date)} 미처리: ${row.unresolved_count}</title></circle>`)
          .join("");
        return `<svg viewBox="0 0 ${scale.width} ${scale.height}" role="img" aria-label="Resolution Progress">${grid(rows, scale)}${bars}<polyline points="${points}" fill="none" stroke="#d1242f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>${dots}</svg>`;
      }

      function legend(items) {
        return `<div class="legend">${items.map(([color, label]) => `<span><i style="background:${color}"></i>${label}</span>`).join("")}</div>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      loadAll();
    </script>
  </body>
</html>
